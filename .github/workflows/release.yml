# Builds the plugin and publishes its ZIP file as a GitHub release. Runs
# when a version tag like v0.1.0 is pushed; started by hand from the
# Actions tab, it only tests and builds, without a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only the release job may write. The actions are pinned to commits: a
# moved tag cannot change what runs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A release of version 0.1.0 is tagged v0.1.0.
      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^pluginVersion *= *//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the pluginVersion $version in gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      # Also checks that the Gradle wrapper is one of Gradle's.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The tests of the protocol run against the released server.
      - name: Download codesonar-lsp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir server
          cd server
          gh release download --repo jclsn/codesonar-lsp \
            --pattern '*-x86_64-unknown-linux-musl.tar.gz' --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          tar xzf codesonar-lsp-*.tar.gz --strip-components 1
          echo "CODESONAR_LSP=$PWD/codesonar-lsp" >> "$GITHUB_ENV"

      # Downloads the CLion of gradle.properties to build against.
      - run: ./gradlew test buildPlugin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: build/distributions/codesonar-clion-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum codesonar-clion-*.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            codesonar-clion-*.zip SHA256SUMS
